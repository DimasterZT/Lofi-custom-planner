name: CI

on:
  push:
    branches: ['main', 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify PowerShell and planner behaviors
        shell: powershell
        run: ./scripts/Check.ps1
      - name: Check release packaging
        shell: powershell
        run: ./scripts/Package.ps1 -Version dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-preview
          path: dist/*
          if-no-files-found: error
          retention-days: 7
