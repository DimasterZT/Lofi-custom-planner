name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish Windows ZIP
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify planner
        shell: powershell
        run: ./scripts/Check.ps1
      - name: Package
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/Package.ps1 -Version $env:RELEASE_TAG
      - name: Publish release and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "Lofi custom planner $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
